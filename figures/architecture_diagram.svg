<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#F8FAFC"/>

  <!-- Input -->
  <rect x="20" y="170" width="130" height="70" rx="10" fill="#0F172A"/>
  <text x="85" y="200" text-anchor="middle" fill="white" font-size="14" font-weight="600">Query /</text>
  <text x="85" y="218" text-anchor="middle" fill="white" font-size="14" font-weight="600">Document Chunk</text>

  <!-- Arrow -->
  <line x1="150" y1="205" x2="195" y2="205" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 1 -->
  <rect x="200" y="150" width="150" height="110" rx="10" fill="white" stroke="#3B82F6" stroke-width="2"/>
  <text x="275" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Layer 1</text>
  <text x="275" y="200" text-anchor="middle" font-size="11" fill="#475569">Context-aware regex</text>
  <text x="275" y="216" text-anchor="middle" font-size="11" fill="#475569">~0.1ms</text>
  <text x="275" y="240" text-anchor="middle" font-size="10" fill="#94A3B8">v1 → v2 → v3</text>

  <!-- Arrow -->
  <line x1="350" y1="205" x2="395" y2="205" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2 -->
  <rect x="400" y="150" width="150" height="110" rx="10" fill="white" stroke="#8B5CF6" stroke-width="2"/>
  <text x="475" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Layer 2</text>
  <text x="475" y="200" text-anchor="middle" font-size="11" fill="#475569">FAISS embedding</text>
  <text x="475" y="216" text-anchor="middle" font-size="11" fill="#475569">similarity, ~8-15ms</text>
  <text x="475" y="240" text-anchor="middle" font-size="10" fill="#94A3B8">threshold 0.50</text>

  <!-- Arrow -->
  <line x1="550" y1="205" x2="595" y2="205" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3 -->
  <rect x="600" y="150" width="150" height="110" rx="10" fill="white" stroke="#EF4444" stroke-width="2"/>
  <text x="675" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Layer 3</text>
  <text x="675" y="200" text-anchor="middle" font-size="11" fill="#475569">RoBERTa classifier</text>
  <text x="675" y="216" text-anchor="middle" font-size="11" fill="#475569">~10-20ms</text>
  <text x="675" y="240" text-anchor="middle" font-size="10" fill="#94A3B8">threshold 0.50</text>

  <!-- Arrow to output -->
  <line x1="750" y1="205" x2="795" y2="205" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="800" y="175" width="85" height="60" rx="10" fill="#16A34A"/>
  <text x="842" y="200" text-anchor="middle" fill="white" font-size="12" font-weight="600">Pass</text>
  <text x="842" y="218" text-anchor="middle" fill="white" font-size="10">(if clean)</text>

  <!-- Early exit block arrows going down to a shared "blocked" box -->
  <line x1="275" y1="260" x2="275" y2="320" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowred)"/>
  <line x1="475" y1="260" x2="475" y2="320" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowred)"/>
  <line x1="675" y1="260" x2="675" y2="320" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowred)"/>

  <rect x="230" y="330" width="490" height="55" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="475" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">Blocked</text>
  <text x="475" y="371" text-anchor="middle" font-size="10" fill="#991B1B">Early exit at first layer that flags injection -- logged with layer + confidence</text>

  <!-- Legend -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">RAG-PIF: 3-Layer Prompt Injection Firewall</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#64748B">Cascade design: fast/cheap layers first, expensive/accurate layers last. Early exit on first block.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#EF4444"/>
    </marker>
  </defs>
</svg>
